<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Raj Tiwari, Technical Lead and Senior Backend Engineer, New Delhi">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E2A44" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0D1321" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0D1321" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0D1321" stop-opacity="0"/>
    </linearGradient>
    <style>
      .f { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: Consolas, 'SF Mono', Menlo, monospace; }
      @keyframes blink { 50% { opacity: 0; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="18" fill="#0D1321"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="18" fill="url(#fade)"/>

  <!-- top line -->
  <text x="56" y="62" class="f" font-size="16" fill="#8C97AD" letter-spacing="1">TECHNICAL LEAD  /  SENIOR BACKEND ENGINEER</text>
  <text x="1144" y="62" class="f" font-size="16" fill="#8C97AD" text-anchor="end" letter-spacing="1">NEW DELHI, IN</text>

  <!-- name -->
  <text x="52" y="190" class="f" font-size="118" font-weight="800" fill="#FFFFFF" letter-spacing="-4">RAJ TIWARI</text>
  <rect x="58" y="214" width="96" height="8" fill="#F2B33D"/>

  <!-- tagline -->
  <text x="56" y="268" class="f" font-size="26" fill="#D5DBE7">I build the backend systems brands run on.</text>

  <!-- terminal line -->
  <text x="56" y="312" class="mono" font-size="18" fill="#6F8CFF">$ <tspan fill="#D5DBE7">stack</tspan> <tspan fill="#8C97AD">--core</tspan> <tspan fill="#F2B33D">laravel php node.js shopify aws ai</tspan><tspan class="cursor" fill="#D5DBE7"> █</tspan></text>

  <!-- stats -->
  <g class="f">
    <line x1="56" y1="346" x2="1144" y2="346" stroke="#24304A"/>
    <text x="56"  y="386" font-size="28" font-weight="700" fill="#FFFFFF">10+<tspan font-size="16" font-weight="400" fill="#8C97AD"> years building backends</tspan></text>
    <text x="370" y="386" font-size="28" font-weight="700" fill="#FFFFFF">80+<tspan font-size="16" font-weight="400" fill="#8C97AD"> projects delivered</tspan></text>
    <text x="640" y="386" font-size="28" font-weight="700" fill="#FFFFFF">15+<tspan font-size="16" font-weight="400" fill="#8C97AD"> developers led</tspan></text>
    <text x="880" y="386" font-size="28" font-weight="700" fill="#FFFFFF">16<tspan font-size="16" font-weight="400" fill="#8C97AD"> live platforms</tspan></text>
  </g>
</svg>
